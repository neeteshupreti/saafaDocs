name: docscan_pro
description: On-device document scanner, OCR and PDF export for Android and Web.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  google_mlkit_document_scanner: ^0.4.0
  google_mlkit_text_recognition: ^0.15.0
  google_mobile_ads: ^9.0.0
  image: ^4.2.0
  pdf: ^3.11.1
  path_provider: ^2.1.3
  path: ^1.9.0
  share_plus: ^13.3.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.0
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/safaaDocs.jpg
